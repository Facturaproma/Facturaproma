name: Sauvegarde Supabase (chiffrée)

# Sauvegarde hebdomadaire de la base, CHIFFRÉE avant d'être déposée comme
# "artifact" GitHub (conservé 90 jours). Ce dépôt est public : sans chiffrement,
# les données clients seraient lisibles par n'importe qui. Ne jamais retirer l'étape de chiffrement.
#
# Secrets à créer (Settings > Secrets and variables > Actions > New repository secret) :
#   SUPABASE_DB_PASSWORD  mot de passe de la base (Supabase > Database > Settings), SANS ajouter d'adresse :
#                         l'hôte et l'utilisateur sont fixés plus bas, ce qui évite tout problème de caractères spéciaux
#   BACKUP_PASSPHRASE   phrase secrète longue, à noter dans un gestionnaire de mots de passe
on:
  schedule:
    - cron: '23 3 * * 1'   # chaque lundi à 03:23 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les secrets
        env:
          DB: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PP: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PP" ]; then
            echo "::error::Secrets SUPABASE_DB_PASSWORD et BACKUP_PASSPHRASE requis (voir l'en-tête du fichier)."
            exit 1
          fi
          if [ ${#PP} -lt 16 ]; then echo "::error::BACKUP_PASSPHRASE trop courte (16 caractères minimum)."; exit 1; fi

      - name: Installer pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Préparer le mot de passe
        env:
          RAW: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Accepte soit le mot de passe seul, soit (par erreur) l'URL complète postgresql://user:motdepasse@hote/base
          P=$(python3 - <<'PY'
          import os, re
          raw = os.environ["RAW"].strip()
          m = re.match(r"^postgres(?:ql)?://[^:/@]+:(.*)@[^@]*$", raw, re.I | re.S)
          if m:
              raw = m.group(1)
              print("::notice title=info::Le secret contenait une URL complete : mot de passe extrait automatiquement. Remplace-le par le mot de passe seul quand tu peux.", file=__import__("sys").stderr)
          raw = raw.strip().strip("[]")
          print(re.sub(r"\s", "", raw))
          PY
          )
          if [ -z "$P" ]; then echo "::error::Mot de passe vide après nettoyage."; exit 1; fi
          echo "::add-mask::$P"
          echo "PGPASSWORD=$P" >> "$GITHUB_ENV"

      - name: Exporter la base
        env:
          # Session pooler (IPv4) du projet facturapro-prod ; seul le mot de passe est secret
          PGHOST: aws-1-eu-north-1.pooler.supabase.com
          PGPORT: '5432'
          PGUSER: postgres.mdozjptoecygmpkjlohr
          PGDATABASE: postgres
          PGSSLMODE: require
        run: |
          set -euo pipefail
          D=$(date -u +%Y-%m-%d)
          mkdir out
          # Schéma public complet (tables, fonctions, règles RLS) + données
          pg_dump --no-owner --no-privileges -n public -f out/public-$D.sql
          # Comptes (e-mails, hash) : utile pour une restauration complète
          pg_dump --no-owner --no-privileges --data-only -t auth.users -t auth.identities -f out/auth-$D.sql \
            || echo "::warning::Export des comptes (auth) impossible, sauvegarde du schéma public seulement."
          # Contrôle minimal : le fichier doit contenir la table principale
          grep -q "user_data" out/public-$D.sql
          test "$(wc -c < out/public-$D.sql)" -gt 5000
          ls -l out
          tar czf backup-$D.tar.gz -C out .
          echo "BACKUP_FILE=backup-$D.tar.gz" >> "$GITHUB_ENV"

      - name: Chiffrer (AES-256)
        env:
          PP: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PP" \
              --symmetric --cipher-algo AES256 -o "$BACKUP_FILE.gpg" "$BACKUP_FILE"
          rm -rf out "$BACKUP_FILE"
          ls -l

      - name: Déposer la sauvegarde chiffrée
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-supabase
          path: "*.gpg"
          retention-days: 90
          if-no-files-found: error
