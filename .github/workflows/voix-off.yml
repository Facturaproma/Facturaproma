# Génération de la voix off de la vidéo de démonstration (branche voix-off-tts uniquement, aucun secret, aucune donnée client).
name: voix-off
on:
  push:
    branches: [voix-off-tts]
    paths: ['scripts/voix/**', '.github/workflows/voix-off.yml']
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install edge-tts==7.3.1 faster-whisper==1.2.1
      - run: python scripts/voix/generer.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voix-off
          path: out/
          retention-days: 7
      - name: Déposer les fichiers audio sur la branche (le téléchargement d'artefacts est bloqué côté assistant)
        run: |
          rm -rf voix-out && mkdir voix-out && cp out/* voix-out/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voix-out && git commit -m "voix-off : fichiers générés (run ${{ github.run_id }})" && git push origin HEAD:voix-off-tts
