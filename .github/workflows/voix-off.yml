# Génération de la voix off de la vidéo de démonstration (branche voix-off-tts uniquement, aucun secret, aucune donnée client).
name: voix-off
on:
  push:
    branches: [voix-off-tts]
    paths: ['scripts/voix/**', '.github/workflows/voix-off.yml']
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install edge-tts==7.3.1 faster-whisper==1.2.1
      - run: python scripts/voix/generer.py
      - run: python scripts/voix/assembler.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voix-off
          path: out/
          retention-days: 7
