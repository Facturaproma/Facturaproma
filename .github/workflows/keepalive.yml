name: Supabase keepalive

# Évite la mise en pause du projet Supabase gratuit (inactivité d'1 semaine).
# La clé "anon" est la clé publique déjà présente dans app.html ; la sécurité
# repose sur le RLS. La requête ne renvoie aucune donnée (0 ligne sans connexion).
on:
  schedule:
    - cron: '17 6 * * *'   # tous les jours à 06:17 UTC
  workflow_dispatch:

# Moindre privilège : le jeton du workflow ne peut que lire le dépôt
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://mdozjptoecygmpkjlohr.supabase.co/rest/v1/user_data?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kb3pqcHRvZWN5Z21wa2psb2hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MjE2MzUsImV4cCI6MjA5Mjk5NzYzNX0.Q9D4NV_1NiGq7b9vbViT4iBJM7HMOYk5e8QrfhkZ9-Q" -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kb3pqcHRvZWN5Z21wa2psb2hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MjE2MzUsImV4cCI6MjA5Mjk5NzYzNX0.Q9D4NV_1NiGq7b9vbViT4iBJM7HMOYk5e8QrfhkZ9-Q")
          echo "HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then exit 1; fi
