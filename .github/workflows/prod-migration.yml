# MIGRATION DE PRODUCTION (facturapro-prod) : SQL 14 + SQL 18 + durcissement de update_updated_at.
# Pilotée par ops/prod-migration.json (phase idle | apply | rollback). Autorisée par le propriétaire le 22/10/2026.
# Garde-fous : cible fixée (ref du projet dans l'utilisateur de connexion), empreinte des scripts, état attendu de la base,
# sauvegarde chiffrée prise juste avant, UNE transaction (--single-transaction) avec contrôles qui lèvent une erreur => annulation complète.
# Aucune donnée existante n'est modifiée ni supprimée. Aucun mot de passe dans les journaux.
name: prod-migration
on:
  push:
    branches: [validation/integration-documents]
    paths: ['ops/prod-migration.json']
permissions:
  contents: read
concurrency:
  group: prod-migration
  cancel-in-progress: false
jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGHOST: aws-1-eu-north-1.pooler.supabase.com
      PGPORT: '5432'
      PGUSER: postgres.mdozjptoecygmpkjlohr
      PGDATABASE: postgres
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4

      - name: Lire la phase
        id: ph
        run: |
          PHASE=$(python3 -c "import json;print(json.load(open('ops/prod-migration.json'))['phase'])")
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          echo "Phase : $PHASE"

      - name: Installer psql 17
        if: steps.ph.outputs.phase != 'idle'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Préparer le mot de passe
        if: steps.ph.outputs.phase != 'idle'
        env:
          RAW: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          P=$(python3 - <<'PY'
          import os, re
          raw = os.environ["RAW"].strip()
          m = re.match(r"^postgres(?:ql)?://[^:/@]+:(.*)@[^@]*$", raw, re.I | re.S)
          if m: raw = m.group(1)
          print(re.sub(r"\s", "", raw.strip().strip("[]")))
          PY
          )
          test -n "$P"
          echo "::add-mask::$P"
          echo "PGPASSWORD=$P" >> "$GITHUB_ENV"

      - name: Contrôles préalables (lecture seule)
        if: steps.ph.outputs.phase != 'idle'
        run: |
          set -euo pipefail
          PHASE='${{ steps.ph.outputs.phase }}' python3 - <<'PY'
          import json,hashlib,sys,os
          e=json.load(open('ops/prod-migration.json'))['expected']
          files={'apply':(('sql/14_numerotation_et_verrouillage.sql','sql14_sha256_prefix'),('sql/18_contact_public.sql','sql18_sha256_prefix')),
                 'apply19':(('sql/19_journal_sans_doublons.sql','sql19_sha256_prefix'),)}.get(os.environ['PHASE'],())
          for f,k in files:
              h=hashlib.sha256(open(f,'rb').read()).hexdigest()
              if not h.startswith(e[k]): print('::error::Empreinte inattendue pour '+f); sys.exit(1)
          print('Empreintes des scripts : OK')
          PY
          PHASE='${{ steps.ph.outputs.phase }}'
          psql -v ON_ERROR_STOP=1 -qAt -c "select 'cible='||current_setting('server_version_num')" >/dev/null
          # La cible est fixée par PGUSER (postgres.<ref>) ; on contrôle en plus la signature des données
          ROWS=$(psql -v ON_ERROR_STOP=1 -qAt -c "select count(*) from public.user_data")
          USERS=$(psql -v ON_ERROR_STOP=1 -qAt -c "select count(*) from auth.users")
          HAS14=$(psql -qAt -c "select count(*) from pg_proc where proname='next_doc_number'")
          HAS18=$(psql -qAt -c "select count(*) from pg_proc where proname='get_contact_info'")
          echo "user_data=$ROWS comptes=$USERS sql14=$HAS14 sql18=$HAS18"
          if [ "$PHASE" = "apply" ]; then
            test "$ROWS" = "$(python3 -c "import json;print(json.load(open('ops/prod-migration.json'))['expected']['user_data_rows'])")" || { echo "::error::Nombre de lignes user_data inattendu : cible ou état incertain, arrêt."; exit 1; }
            test "$USERS" = "9" || { echo "::error::Nombre de comptes inattendu, arrêt."; exit 1; }
            test "$HAS14" = "0" -a "$HAS18" = "0" || { echo "::error::SQL 14/18 déjà présents (ou partiellement) : arrêt pour analyse."; exit 1; }
          fi
          if [ "$PHASE" = "apply19" ]; then
            test "$USERS" = "9" || { echo "::error::Nombre de comptes inattendu, cible incertaine : arrêt."; exit 1; }
            test "$HAS14" = "1" -a "$HAS18" = "1" || { echo "::error::SQL 14/18 absents : état inattendu, arrêt."; exit 1; }
            T=$(psql -qAt -c "select count(*) from pg_trigger where tgname like 'trg_guard_issued_invoices%' and not tgisinternal")
            test "$T" = "3" || { echo "::error::Déclencheurs de verrouillage absents ($T/3) : arrêt."; exit 1; }
            ALREADY=$(psql -qAt -c "select count(*) from pg_proc where proname='guard_issued_invoices' and prosrc like '%skip_log%'")
            test "$ALREADY" = "0" || { echo "::error::Correctif 19 déjà présent : rien à faire, arrêt."; exit 1; }
            psql -qAt -c "select 'avant: doc_events='||(select count(*) from public.doc_events)||' doc_counters_somme='||coalesce((select sum(last_value) from public.doc_counters),0)||' user_data='||(select count(*) from public.user_data)" | tee /tmp/before.txt
          fi

      - name: Sauvegarde chiffrée juste avant
        if: steps.ph.outputs.phase == 'apply' || steps.ph.outputs.phase == 'apply19'
        env:
          PP: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          D=$(date -u +%Y-%m-%dT%H%M)
          mkdir out
          pg_dump --no-owner --no-privileges -n public -f out/public-$D.sql
          pg_dump --no-owner --no-privileges --data-only -t auth.users -t auth.identities -f out/auth-$D.sql || echo "::warning::auth non exporté"
          grep -q user_data out/public-$D.sql
          tar czf pre-migration-$D.tar.gz -C out .
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PP" --symmetric --cipher-algo AES256 -o pre-migration-$D.tar.gz.gpg pre-migration-$D.tar.gz
          rm -rf out pre-migration-$D.tar.gz
          ls -l *.gpg

      - name: Déposer la sauvegarde chiffrée
        if: steps.ph.outputs.phase == 'apply' || steps.ph.outputs.phase == 'apply19'
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-avant-migration
          path: "*.gpg"
          retention-days: 90
          if-no-files-found: error

      - name: Appliquer SQL 14 + SQL 18 + update_updated_at (une transaction, contrôles intégrés)
        if: steps.ph.outputs.phase == 'apply'
        run: |
          set -euo pipefail
          cat > /tmp/hardening.sql <<'SQL'
          CREATE OR REPLACE FUNCTION update_updated_at() RETURNS TRIGGER AS $$ BEGIN NEW.updated_at = NOW(); RETURN NEW; END; $$ LANGUAGE plpgsql SET search_path = public;
          SQL
          cat > /tmp/checks.sql <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM pg_class WHERE relname IN ('doc_counters','doc_events') AND relnamespace='public'::regnamespace AND relrowsecurity) <> 2 THEN RAISE EXCEPTION 'CONTROLE: tables/RLS'; END IF;
            IF (SELECT count(*) FROM pg_trigger WHERE tgname LIKE 'trg_guard_issued_invoices%' AND NOT tgisinternal) <> 3 THEN RAISE EXCEPTION 'CONTROLE: déclencheurs'; END IF;
            IF has_function_privilege('anon','public.next_doc_number(text,int)','EXECUTE') THEN RAISE EXCEPTION 'CONTROLE: anon peut next_doc_number'; END IF;
            IF NOT has_function_privilege('authenticated','public.next_doc_number(text,int)','EXECUTE') THEN RAISE EXCEPTION 'CONTROLE: authenticated sans next_doc_number'; END IF;
            IF has_function_privilege('anon','public.get_contact_info()','EXECUTE') THEN RAISE EXCEPTION 'CONTROLE: anon peut get_contact_info'; END IF;
            IF NOT has_function_privilege('authenticated','public.get_contact_info()','EXECUTE') THEN RAISE EXCEPTION 'CONTROLE: authenticated sans get_contact_info'; END IF;
            IF has_function_privilege('authenticated','public.guard_issued_invoices()','EXECUTE') THEN RAISE EXCEPTION 'CONTROLE: guard exposé'; END IF;
            IF (SELECT proconfig::text FROM pg_proc WHERE proname='update_updated_at' AND pronamespace='public'::regnamespace) IS DISTINCT FROM '{search_path=public}' THEN RAISE EXCEPTION 'CONTROLE: update_updated_at'; END IF;
            IF EXISTS (SELECT 1 FROM pg_proc p WHERE p.pronamespace='public'::regnamespace AND p.prosecdef AND has_function_privilege('anon', p.oid, 'EXECUTE')) THEN RAISE EXCEPTION 'CONTROLE: fonction SECURITY DEFINER exécutable par anon'; END IF;
            IF (SELECT count(*) FROM public.user_data) <> 47 THEN RAISE EXCEPTION 'CONTROLE: nombre de lignes user_data modifié'; END IF;
            RAISE NOTICE 'CONTROLES TRANSACTION : OK';
          END $$;
          SQL
          # Une seule transaction : toute erreur ou tout CONTROLE en échec annule l'ensemble
          psql -v ON_ERROR_STOP=1 --single-transaction -q \
            -f sql/14_numerotation_et_verrouillage.sql \
            -f sql/18_contact_public.sql \
            -f /tmp/hardening.sql \
            -f /tmp/checks.sql 2>&1 | sed 's/^psql:[^ ]* //' | tail -20
          echo "Migration appliquée."

      - name: Contrôles après validation (lecture seule) + test d'émission sous ROLLBACK
        if: steps.ph.outputs.phase == 'apply'
        run: |
          set -euo pipefail
          psql -qAt -c "select 'user_data='||count(*)||' factures_emises='||(select count(*) from public.user_data d, jsonb_array_elements(case when jsonb_typeof(d.value)='array' then d.value else '[]'::jsonb end) e where d.key='invoices' and coalesce(e->>'status','draft')<>'draft') from public.user_data"
          sed -n '/^-- C\./,$p' docs/VERIFICATIONS_POST_SQL14.sql > /tmp/c.sql
          psql -v ON_ERROR_STOP=1 -q -f /tmp/c.sql 2>&1 | tee /tmp/c.out | sed 's/^psql:[^ ]* //'
          ! grep -q "NOTICE:  KO" /tmp/c.out || { echo "::error::Un contrôle d'émission a échoué (KO). Voir le plan de retour arrière."; exit 1; }
          test "$(grep -c 'NOTICE:  OK' /tmp/c.out)" -ge 7 || { echo "::error::Moins de 7 contrôles OK."; exit 1; }
          psql -qAt -c "select 'compte_test_restant='||count(*) from auth.users where email='verif-sql14@test.invalid'"
          psql -qAt -c "select 'user_data_final='||count(*) from public.user_data"

      - name: Appliquer SQL 19 uniquement (une transaction, contrôles intégrés)
        if: steps.ph.outputs.phase == 'apply19'
        run: |
          set -euo pipefail
          cat > /tmp/checks19.sql <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM pg_trigger WHERE tgname LIKE 'trg_guard_issued_invoices%' AND NOT tgisinternal) <> 3 THEN RAISE EXCEPTION 'CONTROLE: déclencheurs'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_proc WHERE proname='guard_issued_invoices' AND pronamespace='public'::regnamespace AND prosrc LIKE '%skip_log%') THEN RAISE EXCEPTION 'CONTROLE: correctif absent'; END IF;
            IF has_function_privilege('anon','public.guard_issued_invoices()','EXECUTE') OR has_function_privilege('authenticated','public.guard_issued_invoices()','EXECUTE') THEN RAISE EXCEPTION 'CONTROLE: fonction exposée'; END IF;
            IF NOT (SELECT prosecdef FROM pg_proc WHERE proname='guard_issued_invoices' AND pronamespace='public'::regnamespace) THEN RAISE EXCEPTION 'CONTROLE: SECURITY DEFINER perdu'; END IF;
            IF EXISTS (SELECT 1 FROM pg_proc p WHERE p.pronamespace='public'::regnamespace AND p.prosecdef AND has_function_privilege('anon', p.oid, 'EXECUTE')) THEN RAISE EXCEPTION 'CONTROLE: fonction SECURITY DEFINER exécutable par anon'; END IF;
            RAISE NOTICE 'CONTROLES TRANSACTION : OK';
          END $$;
          SQL
          psql -v ON_ERROR_STOP=1 --single-transaction -q -f sql/19_journal_sans_doublons.sql -f /tmp/checks19.sql 2>&1 | sed 's/^psql:[^ ]* //' | tail -10
          echo "SQL 19 appliqué."

      - name: Vérification immédiate après SQL 19 (aucune donnée conservée)
        if: steps.ph.outputs.phase == 'apply19'
        run: |
          set -euo pipefail
          psql -qAt -c "select 'après: doc_events='||(select count(*) from public.doc_events)||' doc_counters_somme='||coalesce((select sum(last_value) from public.doc_counters),0)||' user_data='||(select count(*) from public.user_data)" | tee /tmp/after.txt
          python3 - <<'PY'
          import re,sys
          b=dict(re.findall(r'(\w+)=(\d+)',open('/tmp/before.txt').read())); a=dict(re.findall(r'(\w+)=(\d+)',open('/tmp/after.txt').read()))
          for k in ('doc_events','doc_counters_somme'):
              if int(a[k])<int(b[k]): print('::error::'+k+' a diminué (avant %s, après %s)'%(b[k],a[k])); sys.exit(1)
          print('Aucune suppression d\'événement ni de compteur.')
          PY
          psql -qAt -c "select 'permissions: anon_exec='||has_function_privilege('anon','public.guard_issued_invoices()','EXECUTE')||' auth_exec='||has_function_privilege('authenticated','public.guard_issued_invoices()','EXECUTE')||' anon_next_doc='||has_function_privilege('anon','public.next_doc_number(text,int)','EXECUTE')||' anon_contact='||has_function_privilege('anon','public.get_contact_info()','EXECUTE')"
          # Test de non-doublon sous ROLLBACK : compte éphémère, rien n'est conservé
          cat > /tmp/dup.sql <<'SQL'
          begin;
            insert into auth.users(id,email,created_at) values ('00000000-0000-4000-8000-0000000000bb','verif-sql19@test.invalid',now());
            set local role authenticated;
            select set_config('request.jwt.claim.sub','00000000-0000-4000-8000-0000000000bb',true);
            do $$
            declare n int; e int; i int; v jsonb;
            begin
              n := public.next_doc_number('invoice',0);
              v := jsonb_build_array(jsonb_build_object('id','x','number','FAC-2026-'||lpad(n::text,4,'0'),'status','sent','type','invoice','date','2026-10-22','totalTTC',120,'paidAmount',0));
              FOR i IN 1..4 LOOP
                insert into public.user_data(user_id,key,value) values ('00000000-0000-4000-8000-0000000000bb','invoices',v)
                on conflict (user_id,key) do update set value=excluded.value;
              END LOOP;
              select count(*) into e from public.doc_events where user_id='00000000-0000-4000-8000-0000000000bb' and action='emission';
              raise notice '% 4 sauvegardes par upsert : % événement(s) emission (attendu 1)', case when e=1 then 'OK' else 'KO' end, e;
              v := jsonb_set(v,'{0,status}','"paid"'); v := jsonb_set(v,'{0,paidAmount}','120');
              insert into public.user_data(user_id,key,value) values ('00000000-0000-4000-8000-0000000000bb','invoices',v) on conflict (user_id,key) do update set value=excluded.value;
              select count(*) into e from public.doc_events where user_id='00000000-0000-4000-8000-0000000000bb' and action='statut';
              raise notice '% paiement : % événement(s) statut (attendu 1)', case when e=1 then 'OK' else 'KO' end, e;
              begin
                v := jsonb_set(v,'{0,totalTTC}','999');
                insert into public.user_data(user_id,key,value) values ('00000000-0000-4000-8000-0000000000bb','invoices',v) on conflict (user_id,key) do update set value=excluded.value;
                raise notice 'KO modification d''une facture émise acceptée';
              exception when others then raise notice 'OK modification d''une facture émise refusée (%)', left(sqlerrm,22); end;
            end $$;
          rollback;
          SQL
          psql -v ON_ERROR_STOP=1 -q -f /tmp/dup.sql 2>&1 | tee /tmp/dup.out | sed 's/^psql:[^ ]* //'
          ! grep -q "NOTICE:  KO" /tmp/dup.out || { echo "::error::Un contrôle de non-doublon a échoué."; exit 1; }
          test "$(grep -c 'NOTICE:  OK' /tmp/dup.out)" -ge 3 || { echo "::error::Moins de 3 contrôles OK."; exit 1; }
          psql -qAt -c "select 'compte_test_restant='||count(*) from auth.users where email='verif-sql19@test.invalid'"
          psql -qAt -c "select 'user_data_final='||count(*) from public.user_data"

      - name: Retour arrière (phase rollback) — seulement si aucun compteur ni journal produit
        if: steps.ph.outputs.phase == 'rollback'
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 --single-transaction -q <<'SQL'
          DO $$ BEGIN
            IF (SELECT count(*) FROM public.doc_counters) > 0 OR (SELECT count(*) FROM public.doc_events) > 0 THEN
              RAISE EXCEPTION 'ROLLBACK REFUSÉ: des numéros ou journaux ont déjà été produits (perte de données)';
            END IF;
          END $$;
          DROP TRIGGER IF EXISTS trg_guard_issued_invoices_ins ON public.user_data;
          DROP TRIGGER IF EXISTS trg_guard_issued_invoices ON public.user_data;
          DROP TRIGGER IF EXISTS trg_guard_issued_invoices_del ON public.user_data;
          DROP FUNCTION IF EXISTS public.guard_issued_invoices();
          DROP FUNCTION IF EXISTS public.guard_issued_invoices_del();
          DROP FUNCTION IF EXISTS public.next_doc_number(text, int);
          DROP TABLE IF EXISTS public.doc_events;
          DROP TABLE IF EXISTS public.doc_counters;
          DROP FUNCTION IF EXISTS public.get_contact_info();
          SQL
          echo "Retour arrière effectué."
