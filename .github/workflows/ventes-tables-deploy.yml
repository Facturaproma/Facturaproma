# DÉPLOIEMENT SQL « ventes et paiements dans de vraies tables » : sql/15, 16, 17 et 45, en UNE transaction.
# Lancement MANUEL par le propriétaire (Actions > ventes-tables-deploy > Run workflow), branche main uniquement,
# avec la cible (preprod ou prod) et le mot de confirmation APPLIQUER.
# - Crée des tables et des fonctions ; ne modifie ni ne supprime aucune donnée ; tous les comptes restent en mode « legacy ».
# - La bascule des comptes (fp_doc_mode_set) est une étape séparée, compte par compte, réversible.
# - Contrôles avant (cible, prérequis FacturaPro 2.0) et après (fonctions présentes, aucun compte basculé, droits) ; une erreur annule tout.
# Aucun mot de passe dans les journaux.
name: ventes-tables-deploy
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Cible : preprod ou prod'
        required: true
        type: choice
        options: [preprod, prod]
      confirm:
        description: 'Tapez APPLIQUER pour confirmer'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ventes-tables-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'preprod' && 'preprod' || null }}
    timeout-minutes: 20
    steps:
      - name: Confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          C=$(printf '%s' "$CONFIRM" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          if [ "$C" != "APPLIQUER" ]; then echo "::error::Mot de confirmation incorrect : tapez APPLIQUER."; exit 1; fi
          echo "Confirmation reçue."
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer psql 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Connexion (production)
        if: inputs.target == 'prod'
        env:
          RAW: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          P=$(python3 - <<'PY'
          import os, re
          raw = os.environ["RAW"].strip()
          m = re.match(r"^postgres(?:ql)?://[^:/@]+:(.*)@[^@]*$", raw, re.I | re.S)
          if m: raw = m.group(1)
          print(re.sub(r"\s", "", raw.strip().strip("[]")))
          PY
          )
          test -n "$P"
          echo "::add-mask::$P"
          { echo "PGPASSWORD=$P"; echo "PGHOST=aws-1-eu-north-1.pooler.supabase.com"; echo "PGPORT=5432"; echo "PGUSER=postgres.mdozjptoecygmpkjlohr"; echo "PGDATABASE=postgres"; echo "PGSSLMODE=require"; echo "EXPECTED_REF=mdozjptoecygmpkjlohr"; } >> "$GITHUB_ENV"
      - name: Connexion (préproduction)
        if: inputs.target == 'preprod'
        env:
          PREPROD_DB_URL: ${{ secrets.PREPROD_DB_URL }}
        run: |
          test -n "$PREPROD_DB_URL"
          node -e "
            const p = require('./scripts/preprod-db').parseDbUrl(process.env.PREPROD_DB_URL);
            for (const v of [p.password, encodeURIComponent(p.password), p.user, p.host]) if (v) console.log('::add-mask::' + v);
            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_ENV, ['PGPASSWORD=' + p.password, 'PGHOST=' + p.host, 'PGPORT=' + (p.port || 5432), 'PGUSER=' + p.user,
              'PGDATABASE=' + (p.database || 'postgres'), 'PGSSLMODE=require', 'EXPECTED_REF=njjaomichdlnoscrnxlz'].join('\n') + '\n');"
      - name: Contrôles avant (cible et prérequis)
        run: |
          set -euo pipefail
          case "$PGUSER" in *".$EXPECTED_REF") ;; *) echo "::error::Cible inattendue"; exit 1;; esac
          psql -v ON_ERROR_STOP=1 -qAt -c "SELECT 'purchase_credits=' || (to_regclass('public.purchase_credits') IS NOT NULL) || ' fin_figures=' || (to_regprocedure('public.fin_figures(uuid,date,date)') IS NOT NULL) || ' users=' || (SELECT count(*) FROM auth.users)"
          test "$(psql -qAt -c "SELECT to_regclass('public.purchase_credits') IS NOT NULL AND to_regprocedure('public.fin_figures(uuid,date,date)') IS NOT NULL")" = "t"
      - name: Appliquer sql/15, 16, 17, 45 (une transaction)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q --single-transaction -f sql/15_documents.sql -f sql/16_migration_donnees.sql -f sql/17_mode_stockage.sql -f sql/45_ventes_documents.sql
          echo "Scripts appliqués."
      - name: Contrôles après
        run: |
          set -euo pipefail
          R=$(psql -v ON_ERROR_STOP=1 -qAt -c "SELECT (to_regprocedure('public.fp_sales_array(uuid)') IS NOT NULL)
                AND (to_regprocedure('public.fp_doc_mode_set(uuid,text,text,integer)') IS NOT NULL)
                AND (SELECT count(*) FROM pg_trigger WHERE tgname = 'trg_10_fin_documents' AND NOT tgisinternal) = 1
                AND NOT has_function_privilege('anon', 'public.record_payment(text,jsonb,text)', 'EXECUTE')
                AND NOT has_function_privilege('authenticated', 'public.fp_doc_mode_set(uuid,text,text,integer)', 'EXECUTE')
                AND NOT has_table_privilege('anon', 'public.documents', 'SELECT')
                AND NOT has_table_privilege('authenticated', 'public.doc_store_mode', 'SELECT')")
          test "$R" = "t" || { echo "::error::Contrôle après déploiement en échec"; exit 1; }
          psql -qAt -c "SELECT 'comptes en mode documents : ' || count(*) FROM public.doc_store_mode WHERE mode = 'documents'"
          echo "OK : déploiement vérifié ($EXPECTED_REF)."
