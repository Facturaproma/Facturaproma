<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://*.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Facture</title>
<link rel="icon" href="favicon.png">
<style>
  :root { --ink:#1b2430; --mute:#5d6b7a; --line:#dfe5ec; --bg:#f4f6f9; --card:#fff; --ok:#1d7a4b; --warn:#b26a00; --bad:#b3261e; --brand:#1f4e8c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:14px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:0 0 8px; }
  .muted { color:var(--mute); font-size:14px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; justify-content:space-between; }
  .row > div { min-width:200px; flex:1; }
  .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:13px; font-weight:600; }
  .pill.paid { background:#e3f4ea; color:var(--ok); } .pill.partial, .pill.none { background:#fff3dc; color:var(--warn); } .pill.overdue { background:#fde8e6; color:var(--bad); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:8px 6px; border-bottom:1px solid var(--line); text-align:end; vertical-align:top; }
  th:first-child, td:first-child { text-align:start; }
  .end { text-align:end; }
  .langbar { max-width:760px; margin:0 auto; padding:10px 16px 0; text-align:end; }
  .langbtn { width:auto; margin:0; padding:6px 14px; font-size:14px; background:#fff; color:var(--brand); border:1px solid var(--line); }
  [dir=rtl] body { font-family: system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif; }
  th { font-size:12px; text-transform:uppercase; color:var(--mute); }
  .tot { margin-inline-start:auto; max-width:320px; margin-top:12px; }
  .tot div { display:flex; justify-content:space-between; padding:4px 0; }
  .tot .big { font-size:18px; font-weight:700; border-top:2px solid var(--ink); margin-top:6px; padding-top:8px; }
  .tot .due { color:var(--bad); font-weight:700; }
  .rib { direction:ltr; text-align:left; unicode-bidi:isolate; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:15px; word-break:break-all; background:#f4f6f9; padding:8px 10px; border-radius:8px; }
  button { font:inherit; background:var(--brand); color:#fff; border:0; border-radius:10px; padding:12px 18px; cursor:pointer; width:100%; margin-top:6px; }
  .err { text-align:center; padding:36px 16px; }
  footer { text-align:center; color:var(--mute); font-size:12px; padding:8px 0 24px; }
  @media (max-width:520px) { .hide-sm { display:none; } th, td { padding:7px 3px; } }
  @media print { body { background:#fff; } .card { border:0; padding:0; } button, .langbar, footer .noprint { display:none !important; } }
</style>
</head>
<body>
<main id="root"><div class="card muted">Chargement…</div></main>
<script src="facture.js"></script>
</body>
</html>
